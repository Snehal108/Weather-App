<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Weather App </title>
    
    <script src="https://cdn.tailwindcss.com"></script>

  <style>

body.default-bg {
  background-image: url('https://images.unsplash.com/photo-1499346030926-9a72daac6c63?auto=format&fit=crop&w=1920&q=80');
}

body.clear-bg {
  background-image: url('https://img.pikbest.com/wp/202343/clear-sky-clouds-vibrant-summer-a-captivating-background-of-blue-skies-fluffy-and-sunlight_9982034.jpg!sw800');
}

body.clouds-bg {
  background-image: url('https://media.istockphoto.com/id/157527872/photo/storm-cloud.jpg?s=612x612&w=0&k=20&c=wsK-fd2hBm9SGlV_lnKYqFCAS3-_sk-f9GFAUbT6H40=');
}

body.rain-bg {
  background-image: url('https://images.pexels.com/photos/1166991/pexels-photo-1166991.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500');
}
  /* Bonus: add animated raindrops with CSS or canvas */

body.thunder-bg {
  background-image: url('https://plus.unsplash.com/premium_photo-1727471356923-caeb62d474f1?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8dGh1bmRlciUyMHNreSUyMGJhY2tncm91bmR8ZW58MHx8MHx8fDA%3D');
}

body.snow-bg {
  background-image: url('https://plus.unsplash.com/premium_photo-1673980017571-c1d7e3d6d302?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8c25vdyUyMHNreSUyMGJhY2tncm91bmR8ZW58MHx8MHx8fDA%3D');
}

body.hot-bg {
  background-image: url('https://images.unsplash.com/photo-1504370805625-d32c54b16100?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aG90JTIwd2VhdGhlcnxlbnwwfHwwfHx8MA%3D%3D');
}

body.cold-bg {
  background-image: url('https://images.unsplash.com/photo-1485433592409-9018e83a1f0d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fHdpbnRlcnxlbnwwfHwwfHx8MA%3D%3D');
}
/* new updated  */
body.haze-bg {
  background-image: url('https://brightpunjabexpress.com/wp-content/uploads/2020/11/foggy-weather.png');
}

body {
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: background-image 0.7s ease;
}

 /* Dark mode */
 body.dark-bg {
      background-image: none !important;
      background-color: #111827;
    }

    .overlay {
  background-color: rgba(0, 0, 0, 0.1); /* lighter */
  max-width: 400px;
  width: 90vw;
  border-radius: 1rem;
  padding: 2rem;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  color: white;
  text-align: center;
}
    input::placeholder {
      color: #444;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center default-bg">

  <div class="overlay">
    <h1 class="text-3xl font-bold mb-6">🌤️ Weather Report </h1>
    <p id="dateTime" class="mb-4 text-sm font-medium"></p>


    <div class="flex justify-end mb-4">
      <button id="darkModeToggle" class="bg-gray-700 hover:bg-gray-800 text-sm px-4 py-2 rounded">
        Toggle Dark Mode
      </button>
    </div>

    <div class="flex flex-col gap-4 mb-4">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter city name"
        class="p-2 rounded text-black"
      />
      <button
        id="getCityWeather"
        class="bg-blue-500 hover:bg-blue-600 py-2 rounded font-semibold"
      >
        Get Weather
      </button>
      <button
        id="getGeoWeather"
        class="bg-green-500 hover:bg-green-600 py-2 rounded font-semibold"
      >
        Use My Location
      </button>
    </div>

    <div id="weatherResult" class="mt-6"></div>
    <div id="careMessage" class="mt-4 italic text-yellow-200 flex items-center justify-center gap-2 text-center"></div>

    <!-- <p id="careMessage" class="mt-4 italic text-yellow-200"></p> -->

  </div>

  <script src="script.js"></script>

  <script>

    // Dark mode toggle
    const toggleBtn = document.getElementById("darkModeToggle");
    toggleBtn.addEventListener("click", () => {
      const body = document.body;
      body.classList.toggle("dark-bg");

      // When dark mode off, restore last weather background (or default)
      if (!body.classList.contains("dark-bg")) {
        if (window.currentWeatherClass) {
          body.className = window.currentWeatherClass;
        } else {
          body.className = "min-h-screen flex items-center justify-center clear-bg";
        }
      } else {
        // Remove other weather backgrounds when dark mode on
        body.className = "min-h-screen flex items-center justify-center dark-bg";
      }
    });

  </script>

</body>
</html>
